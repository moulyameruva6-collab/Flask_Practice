{% extends 'base.html' %}

{% block content %}

<div style="text-align: center;">

    <h2>Welcome!</h2>

    <p>Manage your Notes and Files here.</p>

    <div>
        <h3>Total Notes: {{ total_notes }}</h3>
        <h3>Total Files: {{ total_files }}</h3>
    </div>

    <br>

    <button>
        <a href="{{ url_for('mynotes') }}">My Notes</a>
    </button>

    <button>
        <a href="{{ url_for('myfiles') }}">My Files</a>
    </button>

</div>

{% endblock %}
