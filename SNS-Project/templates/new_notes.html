{% extends "base.html" %}

{% block title %}
    New Notes
{% endblock %}

{% block navmenu %}
    <a href="/dashboard">Home</a>
    <a href="#">Files</a>
    <a href="/dashboard/notes">Notes</a>
    <a href="#">Profile</a>
    <a href="/logout">Logout</a>
{% endblock %}

{% block content %}

<div style="text-align: center;">

    <h2>SNS -  New Notes</h2>

    <p>start creating new notes to manage your notes.</p>

    <form action="{{ url_for('new_notes') }}" method="POST">

        <div>
            <label for="title">Title</label>
            <input
                type="text" 
                name="title" id="">
        </div>

        <br>

        <div>
            <label for="content">Content</label>
            <br>
            <textarea
             name="content"
                rows="6" cols="40"
                id=""></textarea>
        </div>

        <br>

        <button type="submit">Submit</button>

    </form>

</div>

{% endblock %}
